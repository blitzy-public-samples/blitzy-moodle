# Nginx configuration for Moodle React Frontend SPA
# This configuration serves the React application with optimized caching,
# compression, security headers, and API proxying to the Moodle PHP backend.

# Upstream backend configuration for Moodle PHP API
upstream moodle_backend {
    # Replace with actual Moodle backend server address
    # For Docker deployments, use the service name
    server moodle-php:80;
    
    # Connection settings
    keepalive 32;
}

# HTTP server block
server {
    listen 80;
    listen [::]:80;
    
    # Server name - replace with actual domain in production
    server_name localhost;
    
    # Root directory for React build artifacts
    root /usr/share/nginx/html;
    
    # Default index file
    index index.html;
    
    # Character set
    charset utf-8;
    
    # Maximum request body size (important for file uploads via API)
    client_max_body_size 100M;
    
    # Logging configuration
    access_log /var/log/nginx/react-frontend-access.log;
    error_log /var/log/nginx/react-frontend-error.log warn;
    
    # ================================================================
    # SECURITY HEADERS
    # ================================================================
    
    # Prevent clickjacking attacks
    add_header X-Frame-Options "SAMEORIGIN" always;
    
    # Prevent MIME type sniffing
    add_header X-Content-Type-Options "nosniff" always;
    
    # Enable XSS protection
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Referrer policy for privacy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Content Security Policy (adjust based on requirements)
    # Note: This is a starting point - customize based on your security needs
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://your-api-domain.com;" always;
    
    # ================================================================
    # GZIP COMPRESSION
    # ================================================================
    
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/xhtml+xml
        application/vnd.ms-fontobject
        application/x-font-ttf
        font/opentype
        image/svg+xml
        image/x-icon;
    
    # ================================================================
    # API PROXY CONFIGURATION
    # ================================================================
    
    # Proxy all /api requests to Moodle PHP backend
    location /api/ {
        # Proxy to upstream backend
        proxy_pass http://moodle_backend/api/;
        
        # Preserve original host header
        proxy_set_header Host $host;
        
        # Forward real client IP
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Forward protocol (http/https)
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Forward original URI and query string
        proxy_set_header X-Original-URI $request_uri;
        
        # WebSocket support (if needed for real-time features)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts for API requests
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffering settings for file uploads
        proxy_buffering off;
        proxy_request_buffering off;
        
        # CORS headers (if API is on different domain)
        # Uncomment and customize if needed
        # add_header Access-Control-Allow-Origin "https://your-frontend-domain.com" always;
        # add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        # add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
        # add_header Access-Control-Allow-Credentials "true" always;
        
        # Handle preflight OPTIONS requests
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "https://your-frontend-domain.com" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }
    }
    
    # ================================================================
    # STATIC ASSET CACHING
    # ================================================================
    
    # Cache static assets with hash in filename (long-term caching)
    # These files are immutable and can be cached indefinitely
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        # Check if file has hash in name (Vite naming: filename-[hash].ext)
        if ($request_filename ~* "\-[a-zA-Z0-9]{8,}\.(js|css)$") {
            # Long-term cache for hashed files (1 year)
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }
        
        # Default cache for other static files (1 week)
        add_header Cache-Control "public, max-age=604800" always;
        
        # Enable ETags for cache validation
        etag on;
        
        # Try to serve file, fallback to index.html for SPA routing
        try_files $uri /index.html;
    }
    
    # No caching for index.html to ensure users get latest version
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        
        # Security headers also apply to index.html
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        
        try_files $uri =404;
    }
    
    # ================================================================
    # SPA CLIENT-SIDE ROUTING
    # ================================================================
    
    # Handle all routes and serve index.html for client-side routing
    # This is the fallback for all requests that don't match a file
    location / {
        # Try to serve the requested file
        # If not found, serve index.html for React Router to handle
        try_files $uri $uri/ /index.html;
        
        # Cache control for HTML files
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
    
    # ================================================================
    # ASSETS AND MANIFEST FILES
    # ================================================================
    
    # Serve manifest.json and other PWA files
    location ~* \.(json|webmanifest)$ {
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }
    
    # Serve robots.txt
    location = /robots.txt {
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }
    
    # Serve favicon.ico
    location = /favicon.ico {
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
        log_not_found off;
        access_log off;
    }
    
    # ================================================================
    # ERROR HANDLING
    # ================================================================
    
    # Custom error pages (optional - uncomment and create error pages)
    # error_page 404 /404.html;
    # error_page 500 502 503 504 /50x.html;
    
    # Error page locations
    # location = /404.html {
    #     internal;
    #     root /usr/share/nginx/html;
    # }
    
    # location = /50x.html {
    #     internal;
    #     root /usr/share/nginx/html;
    # }
    
    # Deny access to hidden files (e.g., .git, .env)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # ================================================================
    # HEALTH CHECK ENDPOINT
    # ================================================================
    
    # Health check endpoint for load balancers and monitoring
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}

# ================================================================
# PERFORMANCE OPTIMIZATIONS (Global Settings)
# ================================================================
# These settings should be in the http block of the main nginx.conf
# Included here for reference and documentation

# Sendfile optimization
# sendfile on;

# TCP optimizations
# tcp_nopush on;
# tcp_nodelay on;

# Keepalive timeout
# keepalive_timeout 65;

# Types hash optimization
# types_hash_max_size 2048;

# Server names hash bucket size
# server_names_hash_bucket_size 64;

# Client body buffer size
# client_body_buffer_size 16K;

# Client header buffer size
# client_header_buffer_size 1k;

# Large client header buffers
# large_client_header_buffers 4 8k;

# Output buffers
# output_buffers 1 32k;
# postpone_output 1460;
